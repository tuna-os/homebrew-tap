name: CI

# scripts/validate-tap.sh already existed but nothing ran it, so a formula or
# cask with a Ruby syntax error could merge and only be discovered by a user's
# `brew install`.

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "Casks/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Formula/**"
      - "Casks/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-tap:
    name: Validate formulas and casks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # validate-tap.sh exits 0 with a warning when neither ruby nor brew is on
      # PATH. That is right for a developer's machine and wrong for a gate: it
      # would report success without having checked anything. Fail the job here
      # instead, so a green check always means the syntax check really ran.
      - name: Assert a syntax checker is available
        run: ruby --version

      # The validator's own regression suite must run in the same required
      # check, so neither side of the contract can drift silently (#48).
      - name: Run validator regression suite
        run: bash scripts/test-validate-tap.sh

      - name: Validate formulas and casks
        run: bash scripts/validate-tap.sh

  test-formula:
    name: Test formulas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@main
      # Formulae and casks from a path-tapped (hence untrusted) tap
      # refuse to load until the tap is trusted.
      - name: Trust this checkout
        run: brew trust tuna-os/tap
      - name: Audit formulas
        run: brew audit --strict --online corral-vm
      - name: Install corral-vm and run its test block
        run: |
          brew install --build-from-source corral-vm
          brew test corral-vm

  test-cask:
    name: Test casks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Trust this checkout
        run: brew trust tuna-os/tap
      - name: Audit casks
        run: brew audit --cask --strict tavern
      - name: Install tavern cask and verify launch
        run: |
          brew install --cask tavern
          # The app has no --help/--version exit path: every invocation runs
          # the GUI event loop. Launch it under a virtual display and expect
          # timeout to kill it (exit 124 = healthy launch; anything else is a
          # startup crash, e.g. an unresolvable bundled library).
          xvfb-run -a timeout 25 tavern
          code=$?
          if [ "$code" -ne 124 ]; then
            echo "tavern exited with $code instead of running until timeout" >&2
            exit 1
          fi
